<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CircuitTecture</title>
<meta name="description" content="Manage your CircuitTecture projects, folders, and classroom assignments.">
<meta name="theme-color" content="#0b1120">
<!-- Open Graph -->
<meta property="og:site_name" content="CircuitTecture">
<meta property="og:type" content="website">
<meta property="og:url" content="https://circuittecture.local">
<meta property="og:title" content="Dashboard — CircuitTecture">
<meta property="og:description" content="Your personal CircuitTecture dashboard — manage projects, folders, templates, and account settings.">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dashboard — CircuitTecture">
<meta name="twitter:description" content="Your personal CircuitTecture dashboard — manage projects, folders, templates, and account settings.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M30 62 L46 30 L54 48 L70 38' stroke='%234ade80' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='30' cy='62' r='7' fill='%23f87171'/><circle cx='70' cy='38' r='7' fill='%2360a5fa'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a href="#main-content" class="skip-link" style="position:absolute;top:-100px;left:8px;z-index:1000;background:var(--acc);color:#000;padding:10px 18px;border-radius:0 0 10px 10px;font-weight:700;text-decoration:none;transition:top .2s">Skip to main content</a>
<div id="app">

  <!-- ============ DASHBOARD ============ -->
  <section id="dashboard" class="view">
<header class="topbar">
      <button class="btn icon burger" id="dash-burger" title="Menu">☰</button>
      <a href="/" class="brand small" style="text-decoration:none;color:inherit"><span class="brand-mark">⚡</span> CircuitTecture</a>
      <div class="topbar-search"><input id="dash-search" type="search" placeholder="Search projects…  ( / )" autocomplete="off"></div>
      <nav class="topbar-tabs">
        <button class="tab active" data-tab="mine">My Projects</button>
        <button class="tab" data-tab="templates">Templates</button>
        <button class="tab" data-tab="community">🌍 Community</button>
        <button class="tab" data-tab="classroom">🎓 Classroom</button>
      </nav>
      <div class="topbar-right">
        <a href="/features" class="btn ghost sm" style="text-decoration:none;font-size:12px">Features</a>
        <a href="/docs" class="btn ghost sm" style="text-decoration:none;font-size:12px">Docs</a>
        <div class="avatar-chip" id="user-chip" title="Account menu" role="button" aria-haspopup="menu" aria-label="Account menu"></div>
      </div>
    </header>
    <div class="dash-body">
      <aside class="dash-side" id="dash-side">
        <button class="btn primary block" id="new-project-btn">＋ New Project</button>
        <div class="side-section"><div class="side-title">Folders</div><div id="folder-list"></div></div>
        <div class="side-section"><div class="side-title">Tags</div><div id="tag-cloud"></div></div>
        <div class="side-section" id="dash-stats"></div>
      </aside>
      <main class="dash-main" id="main-content">
        <div id="dash-greeting"></div>
        <div id="dash-recents" class="dash-recents-section hidden"></div>
        <div id="dash-projects" class="project-grid"></div>
      </main>
    </div>
  </section>

</div>

<!-- overlays -->
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tour-root"></div>

<script src="/js/util.js" defer></script>
<script src="/js/boards.js" defer></script>
<script src="/js/parts.js" defer></script>
<script src="/js/templates.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>
